[bar.default]
background_opacity = 0.64999998547136784
end = [
    "tray",
    "sysmon",
    "notifications",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
font_family = "BlexMono Nerd Font Mono"
font_scale = 1.0999999828636646
font_weight = 400
margin_edge = 4
padding = 10
shadow = false
start = [ "workspaces" ]
thickness = 32
widget_spacing = 10

[battery]
warning_threshold = 30

[control_center]
width = 850

    [control_center.calendar]
    show_week_numbers = true

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
auto_hide = true
reserve_space = false
shadow = false

[lockscreen]
blur_intensity = 0.64999998547136784
fingerprint = false
wallpaper = "/home/azmaan/Wallpapers - Desktop/od_fuck_u_nvidia_grey.png"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.64999998547136784
history_retention_hours = 1
max_visible = 2
offset_y = 10
position = "top_center"
scale = 0.85000000521540642

[osd]
background_opacity = 0.64999998547136784
position = "bottom_center"
position_vertical = "bottom_right"

[shell]
clipboard_confirm_clear_history = false
clipboard_history_max_entries = 30
font_family = "BlexMono Nerd Font Mono"
password_style = "random"
popup_shadows = false
settings_window_translucent = true
time_format = "{:%H:%M:%S}VV"

    [shell.launcher]
    categories = false
    compact = true
    fetch_exchange_rates = false

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "center"
    session_placement = "floating"
    session_position = "center"
    shadow = false
    transparency_mode = "glass"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screenshot]
    directory = "/home/azmaan/Screenshots"
    filename_pattern = "%d-%m-%Y_%H-%M"

[system.monitor]
cpu_poll_seconds = 5
disk_poll_seconds = 60
memory_poll_seconds = 5
network_poll_seconds = 5

[theme]
builtin = "Noctalia"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/azmaan/Wallpapers - Desktop"

    [wallpaper.default]
    path = "/home/azmaan/Wallpapers - Desktop/16.jpg"

    [wallpaper.last]
    path = "/home/azmaan/Wallpapers - Desktop/16.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/azmaan/Wallpapers - Desktop/16.jpg"

[weather]
effects = false
refresh_minutes = 90

[widget.network]
show_label = false
